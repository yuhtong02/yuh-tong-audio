
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
}
button {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  padding: 0;
  background: transparent;
  cursor: pointer;
}
button:focus-visible {
  outline: 2px solid #bd7185;
  outline-offset: -2px;
}
</style>
</head>

<body>
<button id="play" type="button"
        aria-label="播放葉淑宜副主任的祝福"
        aria-pressed="false"></button>

<audio id="audio" preload="metadata">
  <source src="ye-shu-yi-blessing.mp3"
          type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("audio");
const button = document.getElementById("play");

button.addEventListener("click", async () => {
  if (audio.paused) {
    try {
      await audio.play();
    } catch (e) {
      console.error("播放失敗", e);
    }
  } else {
    audio.pause();
  }
});

function updateState() {
  const playing = !audio.paused;
  button.setAttribute("aria-pressed", String(playing));
  button.setAttribute(
    "aria-label",
    playing ? "暫停祝福錄音" : "播放葉淑宜副主任的祝福"
  );
}
audio.addEventListener("play", updateState);
audio.addEventListener("pause", updateState);
audio.addEventListener("ended", updateState);
</script>
</body>
</html>
